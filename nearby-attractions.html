<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 렌더 게이트: 매핑 전 placeholder 깜빡임 방지 (매핑 완료 시 페이드인) -->
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>영흥도 노을 스파 애견동반 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="영흥도 노을 스파 애견동반 펜션" />
  <meta property="og:description" content="영흥도 노을스파 애견동반펜션, 오션뷰 개별 바베큐와 스파로 완벽한 힐링! 반려견과 함께하는 가족·커플 여행, 일출·일몰의 감동까지 즐겨보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/DhFSW4kp1was.jpg" />
  <meta property="og:url" content="https://sunsetspa.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="영흥도 노을 스파 애견동반 펜션" />
  <meta name="twitter:description" content="영흥도 노을스파 애견동반펜션, 오션뷰 개별 바베큐와 스파로 완벽한 힐링! 반려견과 함께하는 가족·커플 여행, 일출·일몰의 감동까지 즐겨보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/06/DhFSW4kp1was.jpg" />
  <meta name="naver-site-verification" content="c6c5217f13a0bb50b77e7199ae1e2371bc0cde57" />
  <meta name="google-site-verification" content="70n834hhKjAlRHMVFtX9mYlwm2t2v6NeVZso-803x-Q" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <!-- 원본 travel.html (주변여행지) -->
        <section id="content" class="sub5_1 sub_travel">
          <!-- data-* 속성 : data-nearby-hero-image
               pages.nearbyAttractions.sections[0].hero.images[isSelected][0].url -->
          <div class="sub_visual" data-nearby-hero-image>
            <div class="txt_box">
              <h3>TRAVEL</h3>
              <!-- data-* 속성 : data-property-caption -->
              <span data-property-caption="{name} 주변 여행지"></span>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="sub_inner">
              <ul>
                <li class="on"><a href="./nearby-attractions.html">주변여행지</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont sub_inner">
            <div class="sub_title2">
              <h3 data-nearby-title>Tourist Spot</h3>
              <p data-nearby-description>펜션 근처의 주요 관광지 정보를 확인해 보세요.</p>
            </div>
            <div class="travel_list">
              <!-- data-* 속성 : data-nearby-attractions-list | 동적 매핑 필요
                   pages.nearbyAttractions.sections[0].about[] -->
              <ul data-nearby-attractions-list>
                <!-- MAPPER: about[i] → li > img + strong + p(> span) -->
              </ul>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/nearby-attractions-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/nearby-attractions.js"></script>
  </body>
</html>
